name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning hooks/*.sh bin/tests-ran bin/tests-weakened docs/demo.sh tests/*.sh
      - name: ruff
        if: runner.os == 'Linux'
        run: pipx run ruff check bin/sous lib
      - name: guard table
        run: bash tests/sous-guard.test.sh
      - name: red-team corpus
        run: bash tests/adversarial.test.sh
      - name: guard rules each have a block and an allow fixture
        run: bash tests/rules.test.sh
      - name: tests-ran table
        run: bash tests/tests-ran.test.sh
      - name: tests-weakened table
        run: bash tests/tests-weakened.test.sh
      - name: tables on bash 3.2 (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash tests/sous-guard.test.sh && /bin/bash tests/adversarial.test.sh && /bin/bash tests/rules.test.sh && /bin/bash tests/tests-ran.test.sh && /bin/bash tests/tests-weakened.test.sh
      - name: install + doctor
        run: bash tests/install.test.sh
      - name: install + doctor on bash 3.2 (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash tests/install.test.sh
      - name: gate and fleet on throwaway repos and worktrees
        run: bash tests/gate.test.sh && bash tests/fleet.test.sh
      - name: gate and fleet on bash 3.2 (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash tests/gate.test.sh && /bin/bash tests/fleet.test.sh
      - name: lib unit tests and single sources of truth
        run: bash tests/lib.test.sh && bash tests/ssot.test.sh
      - name: lib and single sources of truth on bash 3.2 (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash tests/lib.test.sh && /bin/bash tests/ssot.test.sh
      - name: python syntax
        run: python3 -m py_compile bin/sous lib/*.py
      - name: validate plugin
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          for t in . .claude-plugin/plugin.json .claude-plugin/marketplace.json commands agents skills mods/handoff; do
            claude plugin validate "$t" --strict
          done
          claude plugin test mods/handoff

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shape (offline, blocking)
        run: python3 bin/sous marketplace-check --offline
      - name: pinned refs resolve to their shas (network failure only warns)
        run: |
          rc=0; python3 bin/sous marketplace-check || rc=$?
          if [ "$rc" -eq 75 ]; then echo "::warning::marketplace-check could not reach a remote; pins not verified"; exit 0; fi
          exit "$rc"
