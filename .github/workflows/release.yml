name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: tag matches plugin.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')" = "$v" ] \
            || { echo "::error::plugin.json is not $v"; exit 1; }
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
