name: test

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Classifier tests (hooks/classify.test.tsx) need the claude CLI; run them locally with `claude plugin test .`.
      - run: node test/verify.mjs
