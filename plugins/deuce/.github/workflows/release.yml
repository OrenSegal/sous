name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches the package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(python -c 'import deuce; print(deuce.__version__)')" = "$v" ] \
            || { echo "::error::deuce.__version__ is not $v"; exit 1; }
      - name: tests (they check the manifests and CHANGELOG against the version)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no '## $v' section"; exit 1; }
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
