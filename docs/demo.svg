<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="sous guard blocking rm -rf, a force push and a .env read, and allowing git status">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre;fill:#c9d1d9}
.cmd{fill:#e6edf3}.p{fill:#7ee787}.block{fill:#ff7b72}.ok{fill:#7ee787}.dim{fill:#8b949e}
.l{animation:in .2s ease-out backwards}
@keyframes in{from{opacity:0}to{opacity:1}}
</style>
<rect width="800" height="412" rx="8" fill="#0d1117"/>
<rect width="800" height="32" rx="8" fill="#161b22"/>
<rect y="24" width="800" height="8" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="400" y="21" text-anchor="middle" class="dim">bash docs/demo.sh</text>
<text x="20" y="66" class="l cmd" style="animation-delay:0.00s"><tspan class="p">$</tspan><tspan class="cmd"> /bin/rm -rf build</tspan></text>
<text x="20" y="86" class="l block" style="animation-delay:0.35s">BLOCKED (sous): recursive force delete. Name the files, list them first, or ask the</text>
<text x="20" y="106" class="l block" style="animation-delay:0.70s">  user.</text>
<text x="20" y="126" class="l dim" style="animation-delay:1.05s">  exit 2</text>
<text x="20" y="146" class="l dim" style="animation-delay:1.40s"></text>
<text x="20" y="166" class="l cmd" style="animation-delay:1.75s"><tspan class="p">$</tspan><tspan class="cmd"> git -C . push -f origin main</tspan></text>
<text x="20" y="186" class="l block" style="animation-delay:2.10s">BLOCKED (sous): force, mirror or delete push. Ask the user; they run it themselves</text>
<text x="20" y="206" class="l block" style="animation-delay:2.45s">  with ! if they want it.</text>
<text x="20" y="226" class="l dim" style="animation-delay:2.80s">  exit 2</text>
<text x="20" y="246" class="l dim" style="animation-delay:3.15s"></text>
<text x="20" y="266" class="l cmd" style="animation-delay:3.50s"><tspan class="p">$</tspan><tspan class="cmd"> sh -c 'cat .env'</tspan></text>
<text x="20" y="286" class="l block" style="animation-delay:3.85s">BLOCKED (sous): the command names .env or a variant, a secrets file. Read</text>
<text x="20" y="306" class="l block" style="animation-delay:4.20s">  .env.example for the key names.</text>
<text x="20" y="326" class="l dim" style="animation-delay:4.55s">  exit 2</text>
<text x="20" y="346" class="l dim" style="animation-delay:4.90s"></text>
<text x="20" y="366" class="l cmd" style="animation-delay:5.25s"><tspan class="p">$</tspan><tspan class="cmd"> git status &amp;&amp; ls src</tspan></text>
<text x="20" y="386" class="l ok" style="animation-delay:5.60s">  exit 0</text>
</svg>
